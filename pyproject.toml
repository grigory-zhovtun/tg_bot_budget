[project]
name = "tg-bot-budget"
version = "1.1.0"
description = "Telegram bot for personal budget tracking in Google Sheets"
requires-python = ">=3.12,<3.13"

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
